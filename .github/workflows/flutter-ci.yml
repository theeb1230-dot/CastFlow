name: Flutter CI

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, phase-1-foundation]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure platform scaffolding
        run: |
          flutter create --platforms=android,ios --org com.castflow .
          rm -f test/widget_test.dart
          cp tools/android_app_build.gradle.kts android/app/build.gradle.kts
      - name: Verify platform configuration
        run: |
          grep -q "android.intent.category.LEANBACK_LAUNCHER" android/app/src/tv/AndroidManifest.xml
          ! grep -q "android.intent.category.LEANBACK_LAUNCHER" android/app/src/mobile/AndroidManifest.xml
          grep -q "android.permission.CHANGE_WIFI_MULTICAST_STATE" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.NEARBY_WIFI_DEVICES" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
          grep -q "castflow/wifi_direct" android/app/src/main/kotlin/com/castflow/castflow/WifiDirectBridge.kt
          grep -q "castflow/screen_capture" android/app/src/main/kotlin/com/castflow/castflow/ScreenCaptureBridge.kt
          grep -q "castflow/media_projection" android/app/src/main/kotlin/com/castflow/castflow/MediaProjectionSessionBridge.kt
          grep -q "onProjectionStopped" android/app/src/main/kotlin/com/castflow/castflow/MediaProjectionSessionBridge.kt
          grep -q "castflow/hardware_encoder" android/app/src/main/kotlin/com/castflow/castflow/HardwareEncoderBridge.kt
          grep -q "castflow/hardware_decoder" android/app/src/main/kotlin/com/castflow/castflow/HardwareDecoderBridge.kt
          grep -q "MediaCodec.createDecoderByType" android/app/src/main/kotlin/com/castflow/castflow/HardwareDecoderBridge.kt
          grep -q "createVirtualDisplay" android/app/src/main/kotlin/com/castflow/castflow/HardwareEncoderBridge.kt
          grep -q "PARAMETER_KEY_VIDEO_BITRATE" android/app/src/main/kotlin/com/castflow/castflow/HardwareEncoderBridge.kt
          grep -q "readyResultCode" android/app/src/main/kotlin/com/castflow/castflow/ScreenCaptureForegroundService.kt
          grep -q 'android:foregroundServiceType="mediaProjection"' android/app/src/main/AndroidManifest.xml
          grep -q "NSLocalNetworkUsageDescription" ios/Runner/Info.plist
          grep -q "_castflow._tcp" ios/Runner/Info.plist
          grep -q 'isMinifyEnabled = true' android/app/build.gradle.kts
          grep -q 'isShrinkResources = true' android/app/build.gradle.kts
      - run: flutter pub get
      - name: Verify formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - run: flutter analyze
      - run: flutter test
      - name: Stress, reconnect, and resource-bound gates
        run: flutter test test/stress --reporter expanded
      - name: Performance regression gate
        run: flutter test test/performance --reporter expanded
      - name: Android native compile smoke test
        run: flutter build apk --debug --flavor mobile
      - name: Build Android Mobile and TV release artifacts
        run: |
          flutter build apk --release --flavor mobile --dart-define=CASTFLOW_TARGET=mobile
          flutter build apk --release --flavor tv --dart-define=CASTFLOW_TARGET=tv
      - name: Validate Android release artifacts
        shell: bash
        run: |
          set -euo pipefail

          MOBILE_APK="$(find build/app/outputs/flutter-apk -type f -name '*mobile-release.apk' -print -quit)"
          TV_APK="$(find build/app/outputs/flutter-apk -type f -name '*tv-release.apk' -print -quit)"

          test -n "$MOBILE_APK" && test -s "$MOBILE_APK"
          test -n "$TV_APK" && test -s "$TV_APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          MOBILE_BADGING="$("$AAPT" dump badging "$MOBILE_APK")"
          TV_BADGING="$("$AAPT" dump badging "$TV_APK")"

          grep -q "package: name='com.castflow.castflow.mobile'" <<<"$MOBILE_BADGING"
          grep -q "package: name='com.castflow.castflow.tv'" <<<"$TV_BADGING"
          grep -q "launchable-activity:" <<<"$MOBILE_BADGING"
          ! grep -q "leanback-launchable-activity:" <<<"$MOBILE_BADGING"
          grep -q "leanback-launchable-activity:" <<<"$TV_BADGING"
          grep -q "uses-feature: name='android.software.leanback'" <<<"$TV_BADGING"

          MOBILE_VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$MOBILE_BADGING" | head -n1)"
          TV_VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$TV_BADGING" | head -n1)"
          MOBILE_VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$MOBILE_BADGING" | head -n1)"
          TV_VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$TV_BADGING" | head -n1)"

          test "$MOBILE_VERSION_CODE" = "$TV_VERSION_CODE"
          test "$MOBILE_VERSION_NAME" = "$TV_VERSION_NAME"
          test "$MOBILE_VERSION_NAME" = "1.0.1"
          test "$MOBILE_VERSION_CODE" = "2"

          "$APKSIGNER" verify --verbose "$MOBILE_APK"
          "$APKSIGNER" verify --verbose "$TV_APK"

          mkdir -p build/release-artifacts
          cp "$MOBILE_APK" "build/release-artifacts/CastFlow-1.0.1+2-Android-Mobile.apk"
          cp "$TV_APK" "build/release-artifacts/CastFlow-1.0.1+2-Android-TV.apk"
          (
            cd build/release-artifacts
            sha256sum CastFlow-*.apk > SHA256SUMS
          )
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          {
            echo "git_commit=$SOURCE_SHA"
            echo "version=1.0.1+2"
            echo "mobile_package=com.castflow.castflow.mobile"
            echo "tv_package=com.castflow.castflow.tv"
          } > build/release-artifacts/BUILD_PROVENANCE.txt
          test "$(wc -l < build/release-artifacts/SHA256SUMS)" -eq 2
          test -z "$(find build/release-artifacts -type f -name '*.aab' -print -quit)"
      - name: Upload validated Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: castflow-android-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/release-artifacts/
          if-no-files-found: error
          retention-days: 14

  ios-replaykit-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS scaffolding
        run: flutter create --platforms=ios --org com.castflow .
      - name: Configure ReplayKit extension target
        run: |
          gem install xcodeproj --no-document
          ruby tools/configure_replaykit.rb
      - name: Validate ReplayKit, VideoToolbox, and Runner bridge wiring
        run: |
          grep -q "BroadcastUploadExtension" ios/Runner.xcodeproj/project.pbxproj
          grep -q "VideoToolboxH264Encoder.swift" ios/Runner.xcodeproj/project.pbxproj
          grep -q "Embed App Extensions" ios/Runner.xcodeproj/project.pbxproj
          grep -q "com.apple.broadcast-services-upload" ios/BroadcastUploadExtension/Info.plist
          grep -q "group.com.castflow.shared" ios/Runner/Runner.entitlements
          grep -q "group.com.castflow.shared" ios/BroadcastUploadExtension/BroadcastUploadExtension.entitlements
          grep -q "VTCompressionSessionCreate" ios/BroadcastUploadExtension/VideoToolboxH264Encoder.swift
          grep -q "kVTCompressionPropertyKey_RealTime" ios/BroadcastUploadExtension/VideoToolboxH264Encoder.swift
          grep -q "ReplayKitSpoolBridge.swift" ios/Runner.xcodeproj/project.pbxproj
          grep -q "ReplayKitSpoolBridge.register(with:" ios/Runner/AppDelegate.swift
          grep -q "castflow/replaykit_encoded/events" ios/Runner/ReplayKitSpoolBridge.swift
          grep -q "ReplayKitLifecycleBridge.swift" ios/Runner.xcodeproj/project.pbxproj
          grep -q "ReplayKitLifecycleBridge.register(with:" ios/Runner/AppDelegate.swift
          grep -q "castflow/replaykit_lifecycle/events" ios/Runner/ReplayKitLifecycleBridge.swift
      - run: flutter pub get
      - name: Build iOS simulator with ReplayKit, VideoToolbox, and Runner bridge
        run: flutter build ios --simulator --debug
      - name: Build unsigned iPhoneOS release app
        run: |
          flutter build ios --release --no-codesign --build-name=1.0.1 --build-number=2
          test -d build/ios/iphoneos/Runner.app
          test -d build/ios/iphoneos/Runner.app/PlugIns/BroadcastUploadExtension.appex
      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          STAGE_DIR="build/ipa-unsigned-stage"
          ARTIFACT_DIR="build/ios-ipa-artifacts"
          IPA="$ARTIFACT_DIR/CastFlow-1.0.1+2-iOS-unsigned.ipa"

          rm -rf "$STAGE_DIR" "$ARTIFACT_DIR"
          mkdir -p "$STAGE_DIR/Payload" "$ARTIFACT_DIR"
          cp -R build/ios/iphoneos/Runner.app "$STAGE_DIR/Payload/Runner.app"

          APP_PLIST="$STAGE_DIR/Payload/Runner.app/Info.plist"
          EXT_PLIST="$STAGE_DIR/Payload/Runner.app/PlugIns/BroadcastUploadExtension.appex/Info.plist"

          set_plist_string() {
            local plist="$1"
            local key="$2"
            local value="$3"
            if /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist"
            else
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
            fi
          }

          set_plist_string "$APP_PLIST" CFBundleShortVersionString "1.0.1"
          set_plist_string "$APP_PLIST" CFBundleVersion "2"
          set_plist_string "$EXT_PLIST" CFBundleShortVersionString "1.0.1"
          set_plist_string "$EXT_PLIST" CFBundleVersion "2"

          (
            cd "$STAGE_DIR"
            zip -qry "../../$IPA" Payload
          )

          bash tools/validate_ios_ipa.sh "$IPA" unsigned
          shasum -a 256 "$IPA" > "$IPA.sha256"
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          {
            echo "git_commit=$SOURCE_SHA"
            echo "version=1.0.1+2"
            echo "bundle_id=com.castflow.castflow"
            echo "extension_bundle_id=com.castflow.castflow.BroadcastUploadExtension"
            echo "signing=unsigned"
            echo "installability=not-claimed"
          } > "$ARTIFACT_DIR/BUILD_PROVENANCE.txt"

          test -s "$IPA"
          test -s "$IPA.sha256"
          test -s "$ARTIFACT_DIR/BUILD_PROVENANCE.txt"
      - name: Upload validated unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: castflow-ios-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/ios-ipa-artifacts/
          if-no-files-found: error
          retention-days: 14


  test-triplet-gate:
    runs-on: ubuntu-latest
    needs: [analyze-test, ios-replaykit-smoke]
    steps:
      - name: Download Android APK pair
        uses: actions/download-artifact@v4
        with:
          name: castflow-android-${{ github.event.pull_request.head.sha || github.sha }}
          path: triplet/android
      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: castflow-ios-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: triplet/ios
      - name: Enforce exact APK + APK TV + IPA triplet
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          MOBILE="triplet/android/CastFlow-1.0.1+2-Android-Mobile.apk"
          TV="triplet/android/CastFlow-1.0.1+2-Android-TV.apk"
          IPA="triplet/ios/CastFlow-1.0.1+2-iOS-unsigned.ipa"

          test -s "$MOBILE"
          test -s "$TV"
          test -s "$IPA"
          test -z "$(find triplet -type f -name '*.aab' -print -quit)"

          grep -qx "git_commit=$SOURCE_SHA" triplet/android/BUILD_PROVENANCE.txt
          grep -qx "git_commit=$SOURCE_SHA" triplet/ios/BUILD_PROVENANCE.txt
          grep -qx "version=1.0.1+2" triplet/android/BUILD_PROVENANCE.txt
          grep -qx "version=1.0.1+2" triplet/ios/BUILD_PROVENANCE.txt

          mkdir -p release-test-triplet
          cp "$MOBILE" release-test-triplet/
          cp "$TV" release-test-triplet/
          cp "$IPA" release-test-triplet/
          (
            cd release-test-triplet
            sha256sum CastFlow-* > SHA256SUMS
          )
          test "$(wc -l < release-test-triplet/SHA256SUMS)" -eq 3
          printf '%s\n'             "source_commit=$SOURCE_SHA"             "version=1.0.1+2"             "grade=developer-test-build"             "ios_signing=unsigned"             "ios_installability=not-claimed"             > release-test-triplet/BUILD_PROVENANCE.txt
      - name: Upload exact three-package test bundle
        uses: actions/upload-artifact@v4
        with:
          name: CastFlow-1.0.1+2-test-triplet-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-test-triplet/
          if-no-files-found: error
          retention-days: 14

  publish-test-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test-triplet-gate]
    steps:
      - name: Download exact three-package test bundle
        uses: actions/download-artifact@v4
        with:
          name: CastFlow-1.0.1+2-test-triplet-${{ github.sha }}
          path: release-test-triplet
      - name: Verify release assets fail-closed
        shell: bash
        run: |
          set -euo pipefail
          test -s release-test-triplet/CastFlow-1.0.1+2-Android-Mobile.apk
          test -s release-test-triplet/CastFlow-1.0.1+2-Android-TV.apk
          test -s release-test-triplet/CastFlow-1.0.1+2-iOS-unsigned.ipa
          test -s release-test-triplet/SHA256SUMS
          test -s release-test-triplet/BUILD_PROVENANCE.txt
          test -z "$(find release-test-triplet -type f -name '*.aab' -print -quit)"
          grep -qx "source_commit=${{ github.sha }}" release-test-triplet/BUILD_PROVENANCE.txt
          grep -qx "version=1.0.1+2" release-test-triplet/BUILD_PROVENANCE.txt
          grep -qx "ios_signing=unsigned" release-test-triplet/BUILD_PROVENANCE.txt
          test "$(wc -l < release-test-triplet/SHA256SUMS)" -eq 3
          (
            cd release-test-triplet
            sha256sum -c SHA256SUMS
          )
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.1-test.${RUN_NUMBER}"
          TITLE="CastFlow 1.0.1+2 Developer Test Build"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          Developer test build for user testing.

          Source commit: ${SOURCE_SHA}
          Version: 1.0.1+2

          Included:
          - Android Mobile APK
          - Android TV APK
          - iOS IPA (unsigned)

          Important: the IPA is unsigned and is not claimed to be directly installable on a normal iPhone. This prerelease is not classified as Experimental/Beta/Golden/Complete until the corresponding runtime/device gates are proven.
          EOF

          gh release create "$TAG" \
            release-test-triplet/CastFlow-1.0.1+2-Android-Mobile.apk \
            release-test-triplet/CastFlow-1.0.1+2-Android-TV.apk \
            release-test-triplet/CastFlow-1.0.1+2-iOS-unsigned.ipa \
            release-test-triplet/SHA256SUMS \
            release-test-triplet/BUILD_PROVENANCE.txt \
            --repo "${{ github.repository }}" \
            --target "$SOURCE_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --prerelease
