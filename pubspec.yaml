name: castflow
description: Ultra-low-latency offline screen mirroring for Android, Android TV, and iOS.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_webrtc: ^1.6.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  nsd: ^5.0.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
